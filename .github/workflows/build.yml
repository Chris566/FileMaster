name: Build Windows .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build FileMaster.exe (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build with PyInstaller
        run: |
          pyinstaller build/filemaster.spec --clean --noconfirm

      - name: List build output
        run: |
          ls -lh build/dist/
          ls -lh build/dist/FileMaster/ 2>/dev/null || true

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-windows
          path: |
            build/dist/FileMaster.exe
            build/dist/FileMaster/
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/FileMaster.exe
          fail_on_unmatched_files: false
